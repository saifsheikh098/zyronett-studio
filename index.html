<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>ZyroNett Studio — Real Estate Reels, Thumbnails & Websites</title>
  <meta name="description" content="ZyroNett Studio edits high-retention property reels, designs high-CTR real estate YouTube thumbnails, and builds lead-focused websites for realtors, builders, and property creators. Delivered in 24 to 48 hours.">
  <meta property="og:title" content="ZyroNett Studio — Real Estate Reels, Thumbnails & Websites">
  <meta property="og:description" content="High-retention reels, clickable thumbnails, and lead-focused websites for real estate brands and creators.">
  <meta property="og:image" content="https://zyronettstudio.online/After-1.jpg">
  <link rel="icon" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070709;
      --card: #111115;
      --card-2: #16161c;
      --border: rgba(255, 255, 255, 0.08);
      --lime: #a3e635;
      --lime-glow: rgba(163, 230, 53, 0.15);
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--text); line-height: 1.55; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .container { width: 100%; max-width: 1160px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }

    /* ---------- Header ---------- */
    header { position: sticky; top: 0; z-index: 100; background: rgba(7,7,9,0.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; min-width: 0; }
    .logo img { height: 34px; width: 34px; border-radius: 8px; object-fit: cover; }
    .logo b { color: var(--lime); }
    .logo span { white-space: nowrap; }
    .nav-links { display: none; gap: 26px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
    .nav-links a:hover { color: var(--text); }
    .nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .pill { background: var(--lime); color: #070709; padding: 9px 18px; border-radius: 99px; font-weight: 800; font-size: 13px; white-space: nowrap; transition: transform .2s, box-shadow .2s; }
    .pill:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--lime-glow); }
    @media (max-width: 600px) { .nav-right .pill { display: none; } }
    .menu-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 18px; cursor: pointer; }
    .mobile-nav { display: none; flex-direction: column; padding: 8px 20px 18px; border-top: 1px solid var(--border); }
    .mobile-nav a { padding: 12px 0; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--border); }
    .mobile-nav.open { display: flex; }
    @media (min-width: 860px) { .nav-links { display: flex; } .menu-btn, .mobile-nav { display: none !important; } }

    /* ---------- Hero ---------- */
    .hero { position: relative; padding-top: 48px; padding-bottom: 40px; overflow: hidden; }
    .hero::before { content: ""; position: absolute; top: -120px; right: -160px; width: 520px; height: 520px; background: radial-gradient(circle, rgba(163,230,53,0.14), transparent 65%); pointer-events: none; }
    .hero-grid { display: grid; gap: 36px; align-items: center; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(163,230,53,0.3); background: rgba(163,230,53,0.06); color: var(--lime); font-size: 12px; font-weight: 700; margin-bottom: 18px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px var(--lime); }
    h1 { font-size: clamp(34px, 7vw, 60px); line-height: 1.08; font-weight: 800; letter-spacing: -1px; margin-bottom: 18px; }
    h1 span, h2 span { color: var(--lime); }
    .lead { color: var(--muted); font-size: clamp(15px, 2.2vw, 17.5px); max-width: 600px; margin-bottom: 26px; }
    .btns { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    @media (min-width: 480px) { .btns { flex-direction: row; flex-wrap: wrap; } }
    .btn { display: inline-block; text-align: center; padding: 15px 24px; border-radius: 12px; font-weight: 800; font-size: 14px; transition: transform .2s, box-shadow .2s, background .2s; }
    .btn-lime { background: var(--lime); color: #070709; }
    .btn-lime:hover { transform: translateY(-2px); box-shadow: 0 10px 30px var(--lime-glow); }
    .btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; }
    .btn-ghost:hover { background: rgba(255,255,255,0.09); }
    .note { font-size: 12.5px; color: var(--muted); }
    @media (min-width: 900px) { .hero { padding-top: 80px; padding-bottom: 8px; } .hero h1 { max-width: 860px; } }

    /* ---------- Strip ---------- */
    .strip { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: #0b0b0e; }
    .strip-row { display: grid; grid-template-columns: repeat(2, 1fr); }
    .strip-item { padding: 16px 10px; line-height: 1.3; text-align: center; border-right: 1px solid var(--border); }
    .strip-item:nth-child(2n) { border-right: none; }
    .strip-item b { display: block; font-size: 20px; font-weight: 800; color: var(--lime); }
    .strip-item span { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
    @media (min-width: 768px) { .strip-row { grid-template-columns: repeat(4, 1fr); } .strip-item:nth-child(2n) { border-right: 1px solid var(--border); } .strip-item:last-child { border-right: none; } }

    /* ---------- Sections ---------- */
    section { padding-top: 72px; padding-bottom: 8px; }
    .tag { color: var(--lime); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.4px; margin-bottom: 8px; display: block; }
    h2 { font-size: clamp(26px, 5vw, 40px); font-weight: 800; line-height: 1.15; letter-spacing: -0.5px; }
    .sub { color: var(--muted); font-size: 14.5px; margin-top: 10px; margin-bottom: 32px; max-width: 620px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 22px; transition: border-color .25s, transform .25s; }
    .card:hover { border-color: rgba(163,230,53,0.3); }

    /* ---------- Reels ---------- */
    .reels { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 640px) { .reels { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px) { .reels { grid-template-columns: repeat(3, 1fr); } }
    .reel { padding: 12px; }
    .reel-frame { position: relative; aspect-ratio: 9/16; width: 100%; border-radius: 14px; overflow: hidden; background: #0b0b0e; border: 1px solid var(--border); margin-bottom: 14px; }
    .reel-frame iframe, .reel-frame video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; background: #000; }
    .reel-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; background: radial-gradient(circle at 50% 35%, rgba(163,230,53,0.10), transparent 60%), #0e0e12; transition: background .25s; }
    .reel-empty:hover { background: radial-gradient(circle at 50% 35%, rgba(163,230,53,0.16), transparent 65%), #111116; }
    .play { width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--lime); display: flex; align-items: center; justify-content: center; color: var(--lime); font-size: 20px; padding-left: 4px; }
    .reel-empty p { font-size: 13px; color: var(--text); font-weight: 700; }
    .reel-empty span { font-size: 12px; color: var(--lime); font-weight: 600; }
    .reel-meta { padding: 0 6px 6px; }
    .reel-meta h3 { font-size: 16.5px; font-weight: 800; margin: 2px 0 6px; }
    .reel-meta p { font-size: 13px; color: var(--muted); }

    /* ---------- Before / After ---------- */
    .ba { display: grid; gap: 26px; align-items: center; }
    @media (min-width: 860px) { .ba { grid-template-columns: 1.2fr 1fr; } }
    .ba-wrap { position: relative; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); user-select: none; touch-action: pan-y; background: #000; }
    .ba-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ba-before { clip-path: inset(0 50% 0 0); }
    .ba-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--lime); transform: translateX(-1px); pointer-events: none; }
    .ba-knob { position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; border-radius: 50%; background: var(--lime); color: #070709; font-weight: 800; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%); box-shadow: 0 0 0 6px rgba(163,230,53,0.2); pointer-events: none; font-size: 14px; }
    .ba-label { position: absolute; top: 12px; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; background: rgba(7,7,9,0.75); border: 1px solid var(--border); }
    .ba-label.l { left: 12px; } .ba-label.r { right: 12px; color: var(--lime); }
    .ba-range { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
    .box { padding: 14px 16px; border-radius: 12px; font-size: 13.5px; color: #e4e4e7; margin-bottom: 12px; }
    .box strong { display: block; margin-bottom: 4px; }
    .box.bad { background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.2); }
    .box.bad strong { color: #f87171; }
    .box.good { background: rgba(163,230,53,0.05); border: 1px solid rgba(163,230,53,0.2); }
    .box.good strong { color: var(--lime); }
    .case-title { font-size: 20px; font-weight: 800; margin: 4px 0 14px; }

    /* ---------- Website projects ---------- */
    .projects { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 760px) { .projects { grid-template-columns: repeat(2, 1fr); } }
    .proj { padding: 12px; display: flex; flex-direction: column; }
    .proj-img { position: relative; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 14px; background: #000; }
    .proj-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .proj:hover .proj-img img { transform: scale(1.04); }
    .proj-badge { position: absolute; left: 10px; top: 10px; background: rgba(7,7,9,0.8); border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; font-size: 11px; font-weight: 700; color: var(--lime); }
    .proj-meta { padding: 0 6px 6px; flex: 1; display: flex; flex-direction: column; }
    .proj-meta .kind { font-size: 12px; color: var(--muted); font-weight: 600; }
    .proj-meta h3 { font-size: 18px; font-weight: 800; margin: 2px 0 8px; }
    .proj-meta p { font-size: 13.5px; color: var(--muted); margin-bottom: 16px; flex: 1; }
    .proj .btn { padding: 12px 18px; font-size: 13px; }

    /* ---------- Services ---------- */
    .services { display: grid; grid-template-columns: 1fr; gap: 18px; }
    @media (min-width: 640px) { .services { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1000px) { .services { grid-template-columns: repeat(4, 1fr); } }
    .svc-icon { width: 46px; height: 46px; border-radius: 12px; background: var(--lime-glow); border: 1px solid rgba(163,230,53,0.25); display: flex; align-items: center; justify-content: center; color: var(--lime); margin-bottom: 16px; }
    .svc-icon svg { width: 22px; height: 22px; }
    .svc h3 { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
    .svc p { font-size: 13.5px; color: var(--muted); margin-bottom: 14px; }
    .svc ul { list-style: none; font-size: 13px; color: #d4d4d8; }
    .svc li { padding: 5px 0; display: flex; gap: 8px; }
    .svc li::before { content: "✓"; color: var(--lime); font-weight: 800; }
    .svc.new { border-color: rgba(163,230,53,0.35); background: linear-gradient(180deg, #121510 0%, var(--card) 100%); position: relative; }
    .new-tag { position: absolute; top: 18px; right: 18px; font-size: 10px; font-weight: 800; background: var(--lime); color: #070709; padding: 3px 9px; border-radius: 99px; text-transform: uppercase; }

    /* ---------- Process ---------- */
    .steps { display: grid; gap: 18px; grid-template-columns: 1fr; counter-reset: s; }
    @media (min-width: 768px) { .steps { grid-template-columns: repeat(3, 1fr); } }
    .step-n { font-size: 40px; font-weight: 800; color: transparent; -webkit-text-stroke: 1.5px var(--lime); line-height: 1; margin-bottom: 12px; }
    .step h3 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
    .step p { font-size: 13.5px; color: var(--muted); }

    /* ---------- Pricing ---------- */
    .prices { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 900px) { .prices { grid-template-columns: repeat(3, 1fr); } }
    .price { display: flex; flex-direction: column; position: relative; }
    .price.pop { border-color: var(--lime); background: linear-gradient(180deg, #111115 0%, #18181f 100%); box-shadow: 0 0 0 1px var(--lime), 0 20px 50px rgba(163,230,53,0.08); }
    .pop-tag { position: absolute; top: -12px; right: 20px; background: var(--lime); color: #070709; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
    .price h3 { font-size: 18px; font-weight: 800; }
    .amt { font-size: 34px; font-weight: 800; margin: 12px 0 4px; }
    .amt span { font-size: 13px; color: var(--muted); font-weight: 500; }
    .feats { list-style: none; margin: 16px 0 22px; border-top: 1px solid var(--border); padding-top: 16px; flex: 1; }
    .feats li { font-size: 13.5px; color: #d4d4d8; margin-bottom: 10px; display: flex; gap: 8px; }
    .feats li b { color: var(--lime); }
    .web-quote { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
    @media (min-width: 768px) { .web-quote { flex-direction: row; align-items: center; justify-content: space-between; } }
    .web-quote h3 { font-size: 17px; font-weight: 800; }
    .web-quote p { font-size: 13.5px; color: var(--muted); }

    /* ---------- FAQ ---------- */
    .faq { display: grid; gap: 12px; max-width: 820px; }
    details { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
    summary { cursor: pointer; font-weight: 700; font-size: 15px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; color: var(--lime); font-weight: 800; font-size: 18px; line-height: 1; }
    details[open] summary::after { content: "–"; }
    details p { color: var(--muted); font-size: 14px; margin-top: 10px; }

    /* ---------- CTA / Footer ---------- */
    .cta { text-align: center; padding: 48px 22px; margin: 80px 0 0; background: linear-gradient(180deg, rgba(163,230,53,0.08) 0%, rgba(17,17,21,0.95) 100%); border: 1px solid rgba(1
